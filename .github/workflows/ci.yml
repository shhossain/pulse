name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli-linux:
    name: CLI and core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Build the CLI (pure Go)
        run: CGO_ENABLED=0 go build ./cmd/pulse
      - name: Test everything that doesn't need macOS
        run: go test $(go list ./... | grep -v /cmd/pulse-app)

  app-macos:
    name: App, UI and end-to-end (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: Build the UI
        run: cd web && pnpm install --frozen-lockfile && pnpm run build
      - name: Vet and test
        run: go vet ./... && go test ./...
      - name: Build the app bundle (universal) and disk image
        run: ARCHS="arm64 amd64" ./scripts/build-app.sh && ./scripts/make-dmg.sh
      - name: End-to-end
        run: test/e2e/run.sh

  python-helper:
    name: Python helper
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The oldest Python the helper supports (pyproject: >=3.8) and a current one. uv installs
      # versions the runner image no longer ships.
      matrix: { python: ["3.8", "3.13"] }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # full version tags only
      - run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s sdk/python/tests -v
