<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Pulse app icon. Source of truth: scripts/make-icon.sh renders it to Pulse.icns. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0A1022"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64D2FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <!-- ring: track, glow, progress -->
  <circle cx="512" cy="512" r="262" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="64"/>
  <path d="M 512.0 250.0 A 262 262 0 1 1 250.5 495.5" fill="none" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="64" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M 512.0 250.0 A 262 262 0 1 1 250.5 495.5" fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round"/>
  <!-- pulse -->
  <path d="M 336 520 L 424 520 L 458 432 L 512 640 L 566 372 L 612 560 L 640 520 L 690 520" fill="none" stroke="#64D2FF" stroke-opacity="0.5" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <path d="M 336 520 L 424 520 L 458 432 L 512 640 L 566 372 L 612 560 L 640 520 L 690 520" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
