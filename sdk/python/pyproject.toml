[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-jobs"
version = "0.1.0"
description = "Report progress, metrics and questions from Python jobs to the Pulse menubar app"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[tool.setuptools.packages.find]
where = ["src"]
